<!DOCTYPE html>
<html lang="en" data-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if title %}
        FastAPI Blog - {{ title }}
        {% else %}
        FastAPI Blog
        {% endif %}
    </title>
    <link href="{{ url_for('static', path='/css/app.css') }}" rel="stylesheet" />
    <meta name="description" content="FastAPI Tutorial">
    <meta name="author" content="Jason Solano">
    <meta property="og:title" content="FastAPI Blog">
    <meta property="og:type" content="website">
    <meta property="og:url" content="">
    <meta property="og:image" content="">
    <meta property="og:image:alt" content="">
    <meta name="theme-color" content="#517b9c">
</head>

    <body class="min-h-screen bg-(--app-bg-main) text-(--app-text-main) antialiased">
    <header class="sticky top-0 z-50 border-b border-white/20 bg-[var(--app-header-bg)] text-[var(--app-header-text)] shadow-lg shadow-slate-900/10 backdrop-blur">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-3 px-4 py-3 sm:px-6 lg:px-8">
            <a href="{{ url_for('index') }}" class="inline-flex items-center gap-3 rounded-xl px-2 py-1 font-semibold tracking-tight transition hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/90 focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--app-header-bg)]">
                <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-white/95 text-sm font-extrabold text-[var(--app-header-bg)] shadow-sm shadow-slate-900/10">FB</span>
                <span class="text-lg">FastAPI Blog</span>
            </a>

            <nav class="hidden md:flex" aria-label="Primary">
                <ul class="flex items-center gap-1">
                    <li>
                        <a href="{{ url_for('index') }}" class="inline-flex items-center rounded-lg px-3 py-2 text-sm font-medium transition hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/90">Home</a>
                    </li>
                </ul>
            </nav>

            <div class="ml-auto flex w-full items-center justify-end gap-2 md:w-auto">
                <div class="relative">
                    <button id="themeButton" type="button" aria-haspopup="menu" aria-expanded="false" class="inline-flex items-center gap-2 rounded-xl border border-white/25 bg-transparent px-3 py-2 text-sm font-semibold text-white transition hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/90">
                        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                            <path d="M10 2.5v1.5" stroke-linecap="round"></path>
                            <path d="M10 16v1.5" stroke-linecap="round"></path>
                            <path d="M4.22 4.22l1.06 1.06" stroke-linecap="round"></path>
                            <path d="M14.72 14.72l1.06 1.06" stroke-linecap="round"></path>
                            <path d="M2.5 10h1.5" stroke-linecap="round"></path>
                            <path d="M16 10h1.5" stroke-linecap="round"></path>
                            <path d="M4.22 15.78l1.06-1.06" stroke-linecap="round"></path>
                            <path d="M14.72 5.28l1.06-1.06" stroke-linecap="round"></path>
                            <circle cx="10" cy="10" r="3.25"></circle>
                        </svg>
                        <span>Theme</span>
                        <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                            <path d="M5 7.5l5 5 5-5" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </button>

                    <div id="themeMenu" hidden class="absolute right-0 top-[calc(100%+0.5rem)] z-20 w-48 overflow-hidden rounded-xl border border-[var(--app-border-color)] bg-[var(--app-bg-surface)] p-1 shadow-xl shadow-slate-900/15">
                        <button type="button" class="flex w-full items-center justify-between rounded-lg px-3 py-2 text-left text-sm font-medium text-(--app-text-main) transition hover:bg-[var(--app-hover-soft)] aria-checked:bg-[var(--app-hover-soft)] aria-checked:text-(--app-text-main)" data-theme-option="light" role="menuitemradio" aria-checked="false">
                            <span class="inline-flex w-5 justify-center" aria-hidden="true">☀️</span>
                            <span class="flex-1 px-2">Light</span>
                            <span class="opacity-0 transition aria-checked:opacity-100">✓</span>
                        </button>
                        <button type="button" class="flex w-full items-center justify-between rounded-lg px-3 py-2 text-left text-sm font-medium text-(--app-text-main) transition hover:bg-[var(--app-hover-soft)] aria-checked:bg-[var(--app-hover-soft)] aria-checked:text-(--app-text-main)" data-theme-option="dark" role="menuitemradio" aria-checked="false">
                            <span class="inline-flex w-5 justify-center" aria-hidden="true">🌙</span>
                            <span class="flex-1 px-2">Dark</span>
                            <span class="opacity-0 transition aria-checked:opacity-100">✓</span>
                        </button>
                        <button type="button" class="flex w-full items-center justify-between rounded-lg px-3 py-2 text-left text-sm font-medium text-(--app-text-main) transition hover:bg-[var(--app-hover-soft)] aria-checked:bg-[var(--app-hover-soft)] aria-checked:text-(--app-text-main)" data-theme-option="auto" role="menuitemradio" aria-checked="true">
                            <span class="inline-flex w-5 justify-center" aria-hidden="true">🌗</span>
                            <span class="flex-1 px-2">Auto</span>
                            <span class="opacity-0 transition aria-checked:opacity-100">✓</span>
                        </button>
                    </div>
                </div>

                <a href="/login" class="inline-flex items-center rounded-xl border border-white/25 px-3 py-2 text-sm font-semibold text-white transition hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/90">Login</a>
                <a href="/register" class="inline-flex items-center rounded-xl border border-white/90 bg-white/95 px-3 py-2 text-sm font-semibold text-[var(--app-header-bg)] transition hover:bg-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/90">Register</a>

                <button id="mobileMenuButton" type="button" aria-controls="mobileMenu" aria-expanded="false" class="inline-flex items-center rounded-xl border border-white/25 p-2 text-white transition hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/90 md:hidden">
                    <span class="sr-only">Toggle navigation menu</span>
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path d="M3 5h14M3 10h14M3 15h14" stroke-linecap="round"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div id="mobileMenu" hidden class="border-t border-white/20 bg-[var(--app-header-bg)] md:hidden">
            <nav class="mx-auto max-w-6xl px-4 py-3 sm:px-6 lg:px-8" aria-label="Mobile primary">
                <a href="{{ url_for('index') }}" class="block rounded-lg border border-white/15 bg-white/10 px-3 py-2 text-sm font-semibold text-white transition hover:bg-white/15">Home</a>
            </nav>
        </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
    {% block content %}
    {% endblock %}
    </main>

    <script>
        (() => {
            const themeKey = 'fastapi-blog-theme';
            const root = document.documentElement;
            const themeButton = document.getElementById('themeButton');
            const themeMenu = document.getElementById('themeMenu');
            const themeOptions = Array.from(document.querySelectorAll('[data-theme-option]'));
            const mobileMenuButton = document.getElementById('mobileMenuButton');
            const mobileMenu = document.getElementById('mobileMenu');
            const systemPreference = window.matchMedia('(prefers-color-scheme: dark)');

            const applyTheme = (theme) => {
                const resolvedTheme = theme === 'auto' ? (systemPreference.matches ? 'dark' : 'light') : theme;

                root.dataset.theme = theme;
                root.classList.toggle('dark', resolvedTheme === 'dark');

                themeOptions.forEach((option) => {
                    const isSelected = option.dataset.themeOption === theme;
                    option.setAttribute('aria-checked', String(isSelected));
                });
            };

            const storedTheme = window.localStorage.getItem(themeKey) || 'auto';
            applyTheme(storedTheme);

            themeButton.addEventListener('click', () => {
                const isOpen = themeMenu.hidden;
                themeMenu.hidden = !isOpen;
                themeButton.setAttribute('aria-expanded', String(isOpen));
            });

            themeOptions.forEach((option) => {
                option.addEventListener('click', () => {
                    const selectedTheme = option.dataset.themeOption;
                    window.localStorage.setItem(themeKey, selectedTheme);
                    applyTheme(selectedTheme);
                    themeMenu.hidden = true;
                    themeButton.setAttribute('aria-expanded', 'false');
                });
            });

            mobileMenuButton.addEventListener('click', () => {
                const isOpen = mobileMenu.hidden;
                mobileMenu.hidden = !isOpen;
                mobileMenuButton.setAttribute('aria-expanded', String(isOpen));
            });

            document.addEventListener('click', (event) => {
                if (!themeMenu.contains(event.target) && !themeButton.contains(event.target)) {
                    themeMenu.hidden = true;
                    themeButton.setAttribute('aria-expanded', 'false');
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    themeMenu.hidden = true;
                    mobileMenu.hidden = true;
                    themeButton.setAttribute('aria-expanded', 'false');
                    mobileMenuButton.setAttribute('aria-expanded', 'false');
                }
            });

            systemPreference.addEventListener('change', () => {
                const currentTheme = window.localStorage.getItem(themeKey) || 'auto';
                applyTheme(currentTheme);
            });
        })();
    </script>
    <script src="{{ url_for('static', path='/js/frontend.js') }}" defer></script>
</body>

</html>
