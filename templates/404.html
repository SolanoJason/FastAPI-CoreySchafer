{% extends "layout.html" %}
{% block content %}
<section class="grid min-h-[calc(100vh-8rem)] place-items-center px-4 py-8 sm:px-6 lg:px-8" aria-labelledby="error-title">
	<div class="grid w-full max-w-2xl gap-5 rounded-lg border border-[var(--app-border-color)] bg-[var(--app-bg-surface)] p-8 text-center shadow-sm sm:p-10">
		<div class="text-5xl font-extrabold tracking-tight text-[var(--app-link-accent)] sm:text-6xl">404</div>
		<p class="text-xs font-bold uppercase tracking-[0.12em] text-[var(--app-text-muted)]">Page not found</p>
		<h1 id="error-title" class="text-3xl font-semibold tracking-tight text-(--app-text-main) sm:text-4xl">The page you are looking for does not exist.</h1>
		<p class="mx-auto max-w-xl text-base leading-7 text-[var(--app-text-muted)]">
			The link may be broken, the page may have moved, or the address may have been typed incorrectly.
		</p>

		<div class="flex flex-wrap justify-center gap-3 pt-1">
			<a href="{{ url_for('index') }}" class="inline-flex items-center rounded-xl border border-[var(--app-border-color)] bg-[var(--app-text-main)] px-4 py-2.5 text-sm font-semibold text-[var(--app-bg-surface)] transition hover:bg-[var(--app-hover-soft)] hover:text-(--app-text-main)">Go Home</a>
			<a href="{{ url_for('index') }}" class="inline-flex items-center rounded-xl border border-(--app-border-subtle) bg-[var(--app-bg-surface-alt)] px-4 py-2.5 text-sm font-semibold text-(--app-text-main) transition hover:border-[var(--app-border-color)] hover:bg-[var(--app-hover-soft)]">Back to posts</a>
		</div>
	</div>
</section>
{% endblock content %}
